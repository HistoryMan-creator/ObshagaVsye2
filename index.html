<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Тренажер ЕГЭ по обществознанию — вторая часть. Задания 18, 19, 20, 22, 25 с методическими подсказками.">
    <title>ЕГЭ Общество: Part 2 PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Стили для кнопки музыки */
        .music-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #FFFFFF;
            border: 2px solid #E5E7EB;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.2s ease;
            color: #1A1A2E;
        }
        .music-toggle:hover {
            background: #F4F4F9;
            border-color: #2AB7CA; /* Голубой цвет сайта при наведении */
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.15);
        }
        .music-toggle.playing {
            border-color: #FE4A90; /* Розовый цвет при проигрывании */
            background: #FFF1F2;
            animation: pulse-music 2s infinite;
        }
        .music-toggle.playing .music-icon {
            animation: bounce-icon 1s infinite alternate;
        }
        @keyframes pulse-music {
            0% { box-shadow: 0 0 0 0 rgba(254, 74, 144, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(254, 74, 144, 0); }
            100% { box-shadow: 0 0 0 0 rgba(254, 74, 144, 0); }
        }
        @keyframes bounce-icon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px) scale(1.1); }
        }
        
        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            .music-toggle {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header" style="text-align: center; padding-bottom: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="auto" class="sad-guy-logo">
                    <style>
                        @keyframes shift-weight {
                            0% { transform: translateX(0) rotate(-2deg); }
                            50% { transform: translateX(5px) rotate(2deg); }
                            100% { transform: translateX(0) rotate(-2deg); }
                        }
                        @keyframes sad-head {
                            0% { transform: rotate(10deg); }
                            50% { transform: rotate(15deg) translateY(2px); }
                            100% { transform: rotate(10deg); }
                        }
                        @keyframes foot-tap-left {
                            0% { transform: translateY(0); }
                            25% { transform: translateY(-4px) rotate(-5deg); }
                            50% { transform: translateY(0); }
                            100% { transform: translateY(0); }
                        }
                        @keyframes foot-tap-right {
                            0% { transform: translateY(0); }
                            50% { transform: translateY(0); }
                            75% { transform: translateY(-4px) rotate(5deg); }
                            100% { transform: translateY(0); }
                        }
                        @keyframes shadow-shift {
                            0% { transform: translateX(0) scaleX(1); opacity: 0.2; }
                            50% { transform: translateX(5px) scaleX(1.1); opacity: 0.1; }
                            100% { transform: translateX(0) scaleX(1); opacity: 0.2; }
                        }
                        @keyframes tear {
                            0% { transform: translateY(0); opacity: 0; }
                            20% { transform: translateY(5px); opacity: 1; }
                            40% { transform: translateY(15px); opacity: 0; }
                            100% { transform: translateY(15px); opacity: 0; }
                        }
                        @keyframes blink {
                            0%, 96%, 100% { transform: scaleY(1); }
                            98% { transform: scaleY(0.1); }
                        }
                        
                        @keyframes leg-left-anim {
                            0% { transform: rotate(0deg); }
                            25% { transform: rotate(5deg); }
                            50% { transform: rotate(0deg); }
                            75% { transform: rotate(-5deg); }
                            100% { transform: rotate(0deg); }
                        }
                        @keyframes leg-right-anim {
                            0% { transform: rotate(0deg); }
                            25% { transform: rotate(-5deg); }
                            50% { transform: rotate(0deg); }
                            75% { transform: rotate(5deg); }
                            100% { transform: rotate(0deg); }
                        }
                        
                        @keyframes sun-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
                        @keyframes sun-move { from { transform: translate(160px, 40px); } to { transform: translate(160px, 40px); } }
                        @keyframes rain-fall {
                            from { transform: translateY(-20px); }
                            to { transform: translateY(150px); }
                        }
                        @keyframes rain-fade {
                            0%, 50% { opacity: 0; }
                            55%, 75% { opacity: 1; }
                            80%, 100% { opacity: 0; }
                        }
                        @keyframes puddle-form {
                            0%, 65% { transform: scale(0); opacity: 0; }
                            66%, 69% { transform: scale(0.3); opacity: 0.5; }
                            70%, 74% { transform: scale(0.6); opacity: 0.7; }
                            75%, 90% { transform: scale(1); opacity: 0.8; }
                            91%, 98% { transform: scale(1); opacity: 0.4; }
                            99%, 100% { transform: scale(0); opacity: 0; }
                        }
                        @keyframes bird-fly {
                            0%, 40% { transform: translateX(250px) translateY(20px); }
                            60%, 100% { transform: translateX(-50px) translateY(-10px); }
                        }
                        @keyframes car-drive {
                            0%, 80% { transform: translateX(-100px); }
                            85%, 100% { transform: translateX(250px); }
                        }
                        @keyframes splash {
                            0%, 82% { transform: scale(0); opacity: 0; }
                            83% { transform: scale(1.5) translateY(-5px); opacity: 1; }
                            86%, 100% { transform: scale(2.5) translateY(-15px); opacity: 0; }
                        }
                        @keyframes cow-run {
                            0%, 20% { transform: translateX(250px); }
                            40%, 100% { transform: translateX(-100px); }
                        }
                        @keyframes obj-bounce {
                            0% { transform: translateY(0); }
                            100% { transform: translateY(-2px); }
                        }
                        @keyframes mom-walk-yell {
                            0%, 80% { transform: translateX(-150px); opacity: 0; }
                            82% { transform: translateX(-100px); opacity: 1; }
                            85% { transform: translateX(20px); opacity: 1; }
                            90%, 95% { transform: translateX(20px); opacity: 1; }
                            98% { transform: translateX(-100px); opacity: 1; }
                            100% { transform: translateX(-150px); opacity: 0; }
                        }
                        @keyframes speech-bubble-pop {
                            0%, 86% { transform: scale(0); opacity: 0; }
                            88%, 94% { transform: scale(1); opacity: 1; }
                            96%, 100% { transform: scale(0); opacity: 0; }
                        }
                        @keyframes hooligan-speech {
                            0%, 46.5% { transform: scale(0); opacity: 0; }
                            47.5%, 53% { transform: scale(1); opacity: 1; }
                            54%, 100% { transform: scale(0); opacity: 0; }
                        }
                        @keyframes attacker-appear {
                            0%, 39% { transform: translateX(250px); opacity: 0; }
                            41%, 54% { transform: translateX(170px); opacity: 1; }
                            55%, 89% { transform: translateX(250px); opacity: 0; }
                            91%, 97% { transform: translateX(170px); opacity: 1; }
                            98%, 100% { transform: translateX(250px); opacity: 0; }
                        }
                        @keyframes rock-throw {
                            0%, 43% { transform: translate(160px, 60px) rotate(0deg); opacity: 0; }
                            44% { transform: translate(160px, 60px) rotate(0deg); opacity: 1; }
                            45.5% { transform: translate(140px, 40px) rotate(180deg); opacity: 1; }
                            47% { transform: translate(110px, 110px) rotate(360deg); opacity: 1; }
                            48%, 100% { transform: translate(110px, 110px) rotate(360deg); opacity: 0; }
                        }
                        @keyframes spit-fly {
                            0%, 93% { transform: translate(170px, 40px) scale(0); opacity: 0; }
                            94% { transform: translate(170px, 40px) scale(1); opacity: 1; }
                            95% { transform: translate(140px, 25px) scale(1); opacity: 1; }
                            96.5% { transform: translate(105px, 35px) scale(1.5); opacity: 1; }
                            98%, 100% { transform: translate(105px, 55px) scale(0); opacity: 0; }
                        }

                        .guy { animation: shift-weight 3s infinite ease-in-out; transform-origin: 100px 120px; }
                        .guy-head { animation: sad-head 3s infinite ease-in-out; transform-origin: 100px 50px; }
                        .leg-left { animation: leg-left-anim 3s infinite ease-in-out; transform-origin: 100px 90px; }
                        .leg-right { animation: leg-right-anim 3s infinite ease-in-out; transform-origin: 100px 90px; }
                        .foot-left { animation: foot-tap-left 3s infinite ease-in-out; transform-origin: 80px 120px; }
                        .foot-right { animation: foot-tap-right 3s infinite ease-in-out; transform-origin: 120px 120px; }
                        .shadow { animation: shadow-shift 3s infinite ease-in-out; transform-origin: 100px 130px; }
                        .tear-drop { animation: tear 4s infinite linear; }
                        .eye { animation: blink 4s infinite; transform-origin: 100px 38px; }
                    </style>

                    <!-- Background Elements -->
                    <g class="bg-elements">
                        <!-- Sun -->
                        <g class="sun" style="animation: sun-move 20s infinite linear;">
                            <circle cx="0" cy="0" r="12" fill="var(--bg)" stroke="var(--text)" stroke-width="3" />
                            <g style="animation: sun-spin 10s infinite linear;">
                                <line x1="0" y1="-15" x2="0" y2="-20" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="0" y1="15" x2="0" y2="20" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="-15" y1="0" x2="-20" y2="0" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="15" y1="0" x2="20" y2="0" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="-10" y1="-10" x2="-14" y2="-14" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="10" y1="10" x2="14" y2="14" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="-10" y1="10" x2="-14" y2="14" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="10" y1="-10" x2="14" y2="-14" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                            </g>
                        </g>

                        <!-- Rain -->
                        <g style="animation: rain-fade 20s infinite linear;">
                            <g style="animation: rain-fall 0.4s infinite linear;">
                                <line x1="30" y1="0" x2="25" y2="15" stroke="var(--blue)" stroke-width="1" />
                                <line x1="60" y1="20" x2="55" y2="35" stroke="var(--blue)" stroke-width="1" />
                                <line x1="90" y1="-10" x2="85" y2="5" stroke="var(--blue)" stroke-width="1" />
                                <line x1="120" y1="10" x2="115" y2="25" stroke="var(--blue)" stroke-width="1" />
                                <line x1="150" y1="0" x2="145" y2="15" stroke="var(--blue)" stroke-width="1" />
                                <line x1="180" y1="30" x2="175" y2="45" stroke="var(--blue)" stroke-width="1" />
                            </g>
                            <g style="animation: rain-fall 0.4s infinite linear 0.2s;">
                                <line x1="40" y1="-5" x2="35" y2="10" stroke="var(--blue)" stroke-width="1" />
                                <line x1="70" y1="15" x2="65" y2="30" stroke="var(--blue)" stroke-width="1" />
                                <line x1="100" y1="-15" x2="95" y2="0" stroke="var(--blue)" stroke-width="1" />
                                <line x1="130" y1="25" x2="125" y2="40" stroke="var(--blue)" stroke-width="1" />
                                <line x1="160" y1="5" x2="155" y2="20" stroke="var(--blue)" stroke-width="1" />
                            </g>
                        </g>

                        <!-- Birds -->
                        <g style="animation: bird-fly 12s infinite linear;">
                            <path d="M 0 0 Q 5 -5 10 0 Q 15 -5 20 0" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                            <path d="M 15 10 Q 20 5 25 10 Q 30 5 35 10" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                        </g>

                        <!-- Car and Splash -->
                        <g style="animation: car-drive 20s infinite linear;">
                            <g style="animation: obj-bounce 0.1s infinite alternate;">
                                <rect x="0" y="105" width="45" height="15" rx="3" fill="var(--blue)" stroke="var(--text)" stroke-width="3" />
                                <rect x="15" y="95" width="20" height="10" rx="2" fill="var(--bg)" stroke="var(--text)" stroke-width="3" />
                                <circle cx="10" cy="120" r="5" fill="var(--text)" />
                                <circle cx="35" cy="120" r="5" fill="var(--text)" />
                                <line x1="25" y1="95" x2="25" y2="105" stroke="var(--text)" stroke-width="3" />
                            </g>
                        </g>

                        <!-- Splash effect from puddle -->
                        <g style="animation: splash 20s infinite linear; transform-origin: 100px 135px;">
                             <path d="M100,135 Q85,90 70,135 Z" fill="var(--blue)" opacity="0.8" />
                             <path d="M100,135 Q115,100 130,135 Z" fill="var(--blue)" opacity="0.8" />
                             <circle cx="85" cy="115" r="5" fill="var(--blue)" />
                             <circle cx="115" cy="115" r="5" fill="var(--blue)" />
                             <circle cx="95" cy="100" r="4" fill="var(--blue)" />
                             <circle cx="105" cy="100" r="4" fill="var(--blue)" />
                        </g>

                        <!-- Cow -->
                        <g style="animation: cow-run 18s infinite linear;">
                            <g style="animation: obj-bounce 0.2s infinite alternate;">
                                <line x1="5" y1="115" x2="5" y2="125" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="10" y1="115" x2="10" y2="125" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="20" y1="115" x2="20" y2="125" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <line x1="25" y1="115" x2="25" y2="125" stroke="var(--text)" stroke-width="3" stroke-linecap="round" />
                                <rect x="0" y="105" width="30" height="15" rx="4" fill="white" stroke="var(--text)" stroke-width="3" />
                                <path d="M 5 105 Q 10 115 5 120 Z" fill="var(--text)" />
                                <path d="M 20 110 Q 25 120 15 120 Z" fill="var(--text)" />
                                <rect x="-10" y="100" width="15" height="12" rx="3" fill="white" stroke="var(--text)" stroke-width="3" />
                                <rect x="-12" y="105" width="6" height="7" rx="2" fill="var(--pink)" stroke="var(--text)" stroke-width="2" />
                                <path d="M -5 100 Q -8 95 -10 98" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                                <path d="M 0 100 Q 3 95 5 98" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                            </g>
                        </g>

                        <!-- Mom Yelling -->
                        <g style="animation: mom-walk-yell 25s infinite linear; transform-origin: 20px 120px;">
                            <line x1="20" y1="90" x2="15" y2="120" stroke="var(--text)" stroke-width="5" stroke-linecap="round" />
                            <line x1="20" y1="90" x2="25" y2="120" stroke="var(--text)" stroke-width="5" stroke-linecap="round" />
                            <path d="M20,50 L20,90" stroke="var(--text)" stroke-width="10" stroke-linecap="round" fill="none" />
                            <circle cx="20" cy="40" r="14" fill="var(--bg)" stroke="var(--text)" stroke-width="4" />
                            <line x1="12" y1="35" x2="16" y2="38" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
                            <line x1="28" y1="35" x2="24" y2="38" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
                            <path d="M15,44 Q20,42 25,44" stroke="var(--text)" stroke-width="2" fill="none" />
                            <g style="animation: speech-bubble-pop 25s infinite cubic-bezier(0.17, 0.89, 0.32, 1.28); transform-origin: 30px 20px;">
                                <path d="M 28 20 L 45 10 Q 55 5 65 10 Q 75 15 70 25 Q 65 35 55 35 Q 45 35 28 20 Z" fill="var(--bg)" stroke="var(--text)" stroke-width="2" />
                                <text x="50" y="24" font-family="var(--font)" font-size="8" font-weight="900" fill="var(--text)" text-anchor="middle">УЧИ!</text>
                            </g>
                        </g>

                        <!-- Attacker (Hooligan) throwing rock and spitting -->
                        <g style="animation: attacker-appear 34s infinite linear; transform-origin: 0px 120px;">
                            <!-- Speech Bubble -->
                            <g style="animation: hooligan-speech 34s infinite cubic-bezier(0.17, 0.89, 0.32, 1.28); transform-origin: -5px 50px;">
                                <path d="M-60,10 Q-60,5 -55,5 L-15,5 Q-10,5 -10,10 L-10,35 Q-10,40 -15,40 L-25,40 L-5,50 L-35,40 L-55,40 Q-60,40 -60,35 Z" fill="var(--bg)" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" />
                                <text x="-35" y="19" font-family="'Space Grotesk', sans-serif" font-size="6" font-weight="bold" fill="var(--text)" text-anchor="middle">
                                    <tspan x="-35" dy="0">ВСЕ РАВНО</tspan>
                                    <tspan x="-35" dy="9">НЕ СДАШЬ!</tspan>
                                </text>
                            </g>
                            <!-- Legs -->
                            <line x1="0" y1="90" x2="-5" y2="120" stroke="var(--text)" stroke-width="4" stroke-linecap="round" />
                            <line x1="0" y1="90" x2="5" y2="120" stroke="var(--text)" stroke-width="4" stroke-linecap="round" />
                            <!-- Torso -->
                            <path d="M0,50 L0,90" stroke="var(--text)" stroke-width="8" stroke-linecap="round" />
                            <!-- Arms -->
                            <path d="M0,60 L-10,50" stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none" /> <!-- Throwing hand -->
                            <path d="M0,60 L15,70 L20,85" stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none" />
                            <!-- Head -->
                            <circle cx="0" cy="40" r="12" fill="var(--bg)" stroke="var(--text)" stroke-width="3" />
                            <!-- Angry eyes -->
                            <line x1="-6" y1="36" x2="-2" y2="39" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                            <line x1="6" y1="36" x2="2" y2="39" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                            <!-- Mouth -->
                            <path d="M-3,44 Q0,42 3,44" stroke="var(--text)" stroke-width="1.5" fill="none" />
                            <!-- Cap (backwards) -->
                            <path d="M-10,32 Q0,25 10,32 Z" fill="var(--pink)" stroke="var(--text)" stroke-width="2" />
                            <line x1="-15" y1="32" x2="-10" y2="32" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
                        </g>

                        <!-- Rock thrown -->
                        <g style="animation: rock-throw 34s infinite linear; transform-origin: 5px 5px;">
                            <path d="M 0 0 L 8 2 L 10 10 L 2 8 Z" fill="var(--text)" />
                        </g>

                        <!-- Spit -->
                        <g style="animation: spit-fly 34s infinite ease-in; transform-origin: 4px 4px;">
                            <path d="M 0 0 Q 4 -6 8 0 L 4 8 Z" fill="#93C5FD" opacity="0.9" />
                            <circle cx="2" cy="-2" r="1.5" fill="#93C5FD" />
                            <circle cx="8" cy="2" r="2" fill="#93C5FD" />
                        </g>
                    </g>

                    <!-- Shadow -->
                    <ellipse cx="100" cy="130" rx="30" ry="6" fill="#1A1A2E" class="shadow" />
                    <!-- Puddle -->
                    <ellipse cx="100" cy="135" rx="40" ry="8" fill="var(--blue)" style="animation: puddle-form 20s infinite linear; transform-origin: 100px 135px;" />
                    
                    <g class="guy">
                        <!-- Legs -->
                        <g class="leg-left">
                            <line x1="100" y1="90" x2="85" y2="120" stroke="var(--text, #1A1A2E)" stroke-width="6" stroke-linecap="round" />
                        </g>
                        <g class="leg-right">
                            <line x1="100" y1="90" x2="115" y2="120" stroke="var(--text, #1A1A2E)" stroke-width="6" stroke-linecap="round" />
                        </g>
                        
                        <!-- Feet -->
                        <g class="foot-left">
                            <path d="M85,120 Q75,125 78,125 L88,125 Z" fill="var(--text, #1A1A2E)" stroke="var(--text, #1A1A2E)" stroke-width="4" stroke-linejoin="round"/>
                        </g>
                        <g class="foot-right">
                            <path d="M115,120 Q125,125 122,125 L112,125 Z" fill="var(--text, #1A1A2E)" stroke="var(--text, #1A1A2E)" stroke-width="4" stroke-linejoin="round"/>
                        </g>

                        <!-- Torso -->
                        <path d="M100,50 L100,90" stroke="var(--text, #1A1A2E)" stroke-width="12" stroke-linecap="round" fill="none" />
                        
                        <!-- Arms drooping -->
                        <path d="M98,55 Q85,75 88,85" stroke="var(--text, #1A1A2E)" stroke-width="6" stroke-linecap="round" fill="none" />
                        <path d="M102,55 Q115,75 112,85" stroke="var(--text, #1A1A2E)" stroke-width="6" stroke-linecap="round" fill="none" />
                        
                        <g class="guy-head">
                            <!-- Head background -->
                            <circle cx="100" cy="40" r="18" fill="var(--bg, #F4F4F9)" stroke="var(--text, #1A1A2E)" stroke-width="5" />
                            <!-- Eyes -->
                            <g class="eye"><line x1="93" y1="38" x2="93" y2="38.1" stroke="var(--text, #1A1A2E)" stroke-width="5" stroke-linecap="round" /></g>
                            <g class="eye"><line x1="107" y1="38" x2="107" y2="38.1" stroke="var(--text, #1A1A2E)" stroke-width="5" stroke-linecap="round" /></g>
                            <!-- Bags under eyes -->
                            <path d="M90,43 Q93,46 96,43 M104,43 Q107,46 110,43" stroke="var(--text, #1A1A2E)" stroke-width="1.5" fill="none" opacity="0.4"/>
                            <!-- Sad Mouth -->
                            <path d="M95,49 Q100,45 105,49" stroke="var(--text, #1A1A2E)" stroke-width="2.5" stroke-linecap="round" fill="none" />
                            
                            <!-- Tear -->
                            <path d="M92,42 Q94,46 92,48 Q90,46 92,42" fill="var(--blue, #2AB7CA)" class="tear-drop" />
